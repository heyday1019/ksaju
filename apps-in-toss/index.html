<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 핀치줌 비활성화(앱인토스 필수) + 노치/홈인디케이터 safe-area 사용 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <!-- SDK 3.x 부터 내비바 이름은 콘솔 등록명에서 내려온다. 여기 title 은 공유/웹 표시용이라
         콘솔 이름과 같게 유지한다 (불일치로 반려된 이력 있음). -->
    <title>K사주타로</title>
    <meta property="og:title" content="K사주타로" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
